# GoReleaser v2 配置。
version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goos:
      - linux
    hooks:
      post:
        # UPX 仅用于压缩 Linux 二进制；本地或 CI 未安装时不阻断快照构建。
        - sh -c 'if command -v upx >/dev/null 2>&1; then upx -9 -f -q "$1"; fi' -- "{{ .Path }}"
  - id: other
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goos:
      - windows
      - darwin
archives:
  - formats:
      - binary
    name_template: "spot_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
checksum:
  name_template: 'checksums.txt'
nfpms:
- file_name_template: 'spot_{{ .Tag }}_{{ .Os }}_{{ .Arch }}'
  homepage: https://github.com/ysicing/spot
  version_metadata: git
  description: |-
    Spot VM Tool
  maintainer: ysicing
  license: MIT
  vendor: https://github.com/ysicing/spot
  formats:
  # - apk
  - deb
  - rpm
  bindir: /usr/bin
  section: utils
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  # If set to true, will not auto-publish the release.
  # Default is false.
  github:
    owner: ysicing
    name: spot
